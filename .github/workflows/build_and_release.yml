name: Build and Release AutoRod

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Distribution
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress
          "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Quality Verification Tests
        run: |
          $env:PYTHONPATH = "src"
          python -m unittest discover -s tests -v

      - name: Build Distribution Packages (Exe, Installer, Portable, Hashes)
        run: |
          python scripts/build_distribution.py

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autorod-distribution-packages
          path: release_artifacts/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: AutoRod ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: release_artifacts/*
          draft: false
          prerelease: false
