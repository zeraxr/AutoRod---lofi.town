name: Build and Release AutoRod

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Distribution
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Inno Setup
        shell: cmd
        run: |
          choco install innosetup --no-progress
          echo C:\Program Files (x86)\Inno Setup 6>> "%GITHUB_PATH%"

      - name: Install Python Dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Quality Verification Tests
        shell: cmd
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -v > test_output.txt 2>&1
          set TEST_STATUS=%ERRORLEVEL%
          type test_output.txt
          type test_output.txt >> "%GITHUB_STEP_SUMMARY%"
          if %TEST_STATUS% neq 0 exit /b %TEST_STATUS%

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: test_output.txt

      - name: Build Distribution Packages (Exe, Installer, Portable, Hashes)
        shell: cmd
        run: |
          python scripts/build_distribution.py

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autorod-distribution-packages
          path: release_artifacts/
          if-no-files-found: warn

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: AutoRod ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            release_artifacts/*.exe
            release_artifacts/*.zip
            release_artifacts/*.txt
          draft: false
          prerelease: false
