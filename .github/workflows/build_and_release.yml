name: Build and Release AutoRod

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Distribution
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Quality Verification Tests
        shell: cmd
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -v

      - name: Build Distribution Packages (Portable Zip and Checksums)
        shell: cmd
        run: |
          python scripts/build_distribution.py --skip-installer

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autorod-distribution-packages
          path: release_artifacts/
          if-no-files-found: warn

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: AutoRod ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            release_artifacts/*.zip
            release_artifacts/*.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync GitHub Release Notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" --notes-file RELEASE_NOTES.md
