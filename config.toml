[autorod]
# Captura y Pantalla
target_fps = 120
monitor_index = 1
capture_source = "mss"
scan_region_enabled = true
scan_x1 = 670
scan_y1 = 246
scan_x2 = 1244
scan_y2 = 700

# Comportamiento
pause_on_defocus = false
minimize_to_tray = true
open_at_startup = false
shortcut_toggle = "F8"
shortcut_stop = "F9"

# Personalización
theme_mode = "dark"
accent_color = "#5554d9"
show_greetings = true
use_local_time = true
enable_transition_animations = true
language = "es"

# Parámetros Internos del Motor
input_backend = "sendinput"
vision_strategy = "geometric_vision_sota"
button_threshold = 0.63
cache_button_size = true
required_cycles_to_lock = 5
cache_inactivity_timeout_s = 90.0
humanized_input = false
ui_theme = "default"
ui_transparency = 1.00
